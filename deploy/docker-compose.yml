services:
  postgres:
    image: postgres:16
    container_name: hm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_BIZ_DB:-insurance_biz}
      POSTGRES_USER: ${POSTGRES_BIZ_USER:-insurance}
      POSTGRES_PASSWORD: ${POSTGRES_BIZ_PASSWORD:-insurance123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BIZ_USER:-insurance} -d ${POSTGRES_BIZ_DB:-insurance_biz}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - insurance-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: hm-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - insurance-net

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: hm-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin2026}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - insurance-net

  milvus:
    image: milvusdb/milvus:v2.6.15
    container_name: hm-milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin2026}
    command: milvus run standalone
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - insurance-net

  biz-service:
    build:
      context: ../biz-service
    container_name: hm-biz-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8001
      BUSINESS_DATABASE_URL: postgresql://${POSTGRES_BIZ_USER:-insurance}:${POSTGRES_BIZ_PASSWORD:-insurance123}@postgres:5432/${POSTGRES_BIZ_DB:-insurance_biz}
      JWT_ISSUER: ${JWT_ISSUER:-hm-insurance}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      REFRESH_TOKEN_COOKIE_SECURE: "false"
      REFRESH_TOKEN_COOKIE_SAMESITE: lax
      APP_WORKSPACE_ROOT: /app
    ports:
      - "${BIZ_SERVICE_PORT:-8001}:8001"
    volumes:
      - ../data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - insurance-net

  frontend:
    image: nginx:alpine
    container_name: hm-frontend
    restart: unless-stopped
    depends_on:
      biz-service:
        condition: service_healthy
    volumes:
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    networks:
      - insurance-net

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  insurance-net:
    driver: bridge
